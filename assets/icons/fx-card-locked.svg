<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="steel-clasp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#949FB1" />
      <stop offset="50%" stop-color="#566070" />
      <stop offset="100%" stop-color="#1E2534" />
    </linearGradient>
    <radialGradient id="locked-shroud" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0B101B" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#070A12" stop-opacity="0.88" />
    </radialGradient>
  </defs>

  <!-- Velo de Acero Ahumado sobre la Carta -->
  <rect x="12" y="12" width="576" height="776" rx="36" fill="url(#locked-shroud)" stroke="url(#steel-clasp)" stroke-width="3" />

  <!-- Bandas de Contención Geométricas -->
  <g stroke="url(#steel-clasp)" stroke-width="2" fill="none">
    <line x1="34" y1="240" x2="566" y2="560" opacity="0.65" />
    <line x1="566" y1="240" x2="34" y2="560" opacity="0.65" />
    <rect x="44" y="44" width="512" height="712" rx="18" stroke-dasharray="12 8" opacity="0.5" />
  </g>

  <!-- Sello Mecánico Central (Gris Acero y Carbón) -->
  <g transform="translate(300, 400)">
    <polygon points="0,-105 91,-52 91,52 0,105 -91,52 -91,-52" fill="#0B101B" stroke="url(#steel-clasp)" stroke-width="4" />
    <polygon points="0,-82 71,-41 71,41 0,82 -71,41 -71,-41" fill="#161B26" stroke="#949FB1" stroke-width="1" />
    <!-- Cerradura Geométrica Sin Icono Genérico -->
    <circle cx="0" cy="-14" r="22" fill="none" stroke="url(#steel-clasp)" stroke-width="5" />
    <polygon points="-18,-2 18,-2 24,38 -24,38" fill="url(#steel-clasp)" />
    <polygon points="0,8 6,18 0,28 -6,18" fill="#0B101B" />
  </g>
</svg>
