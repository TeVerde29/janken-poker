<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <!-- Mismo sistema de iluminación cenital-izquierda -->
    <radialGradient id="studio-vignette" cx="30%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#283142" />
      <stop offset="55%" stop-color="#161B26" />
      <stop offset="100%" stop-color="#0B101B" />
    </radialGradient>

    <linearGradient id="gold-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFE0BB" />
      <stop offset="50%" stop-color="#C8A96A" />
      <stop offset="100%" stop-color="#7D622F" />
    </linearGradient>

    <!-- Pliegues de Papel Algodón Marfil -->
    <linearGradient id="paper-highlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EDE7DA" />
    </linearGradient>
    <linearGradient id="paper-warm-mid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDE7DA" />
      <stop offset="100%" stop-color="#C8BFA8" />
    </linearGradient>
    <linearGradient id="paper-deep-fold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B5AA92" />
      <stop offset="100%" stop-color="#877D68" />
    </linearGradient>

    <filter id="paper-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="12" dy="28" stdDeviation="20" flood-color="#04060B" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- SISTEMA UNIFICADO DE MARCO DE CARTA -->
  <rect x="12" y="12" width="576" height="776" rx="36" fill="url(#studio-vignette)" stroke="url(#gold-frame)" stroke-width="3" />
  <rect x="34" y="34" width="532" height="732" rx="22" fill="none" stroke="url(#gold-frame)" stroke-width="1.2" opacity="0.75" />
  <rect x="48" y="48" width="504" height="704" rx="14" fill="none" stroke="#7A8494" stroke-width="0.75" opacity="0.3" />

  <!-- Índices Geométricos de Esquina (Símbolo Pliegue Romboidal, Sin Texto) -->
  <g transform="translate(76, 80)" stroke="url(#gold-frame)" stroke-width="1.8" fill="#0B101B">
    <polygon points="0,-24 18,0 0,24 -18,0" />
    <polygon points="0,-12 9,0 0,12 -9,0" fill="#F7F4ED" stroke="none" />
  </g>
  <g transform="translate(524, 720) rotate(180)" stroke="url(#gold-frame)" stroke-width="1.8" fill="#0B101B">
    <polygon points="0,-24 18,0 0,24 -18,0" />
    <polygon points="0,-12 9,0 0,12 -9,0" fill="#F7F4ED" stroke="none" />
  </g>

  <!-- Halo de gravedad detrás de la escultura -->
  <circle cx="300" cy="390" r="185" fill="none" stroke="#C8A96A" stroke-width="0.75" opacity="0.3" />
  <circle cx="300" cy="390" r="145" fill="#0B101B" opacity="0.45" />

  <!-- ILUSTRACIÓN ESCULTÓRICA: ARTEFACTO DE PAPEL PLISADO CON CANTO DORADO -->
  <g filter="url(#paper-shadow)" transform="translate(300, 395)">
    <!-- Hoja Base Flotante en Sombra -->
    <polygon points="-95,-175 130,-115 95,185 -135,125" fill="url(#paper-deep-fold)" opacity="0.85" />

    <!-- Pliegue Maestro Izquierdo (Recibe la Key Light) -->
    <polygon points="-20,-205 -150,-30 -15,35" fill="url(#paper-highlight)" />
    
    <!-- Pliegue Maestro Derecho (Sombra Suave Editorial) -->
    <polygon points="-20,-205 145,-55 -15,35" fill="url(#paper-warm-mid)" />

    <!-- Pliegue Inferior Izquierdo (Volumen superpuesto) -->
    <polygon points="-150,-30 -15,35 -85,175" fill="url(#paper-warm-mid)" />

    <!-- Pliegue Inferior Derecho (Tensión arquitectónica) -->
    <polygon points="145,-55 -15,35 20,205" fill="url(#paper-deep-fold)" />
    <polygon points="-15,35 -85,175 20,205" fill="url(#paper-highlight)" />

    <!-- Cantos de Pan de Oro (Gilded Paper Edges) -->
    <g fill="none" stroke="url(#gold-frame)" stroke-width="2.4" stroke-linejoin="round">
      <polyline points="-20,-205 -150,-30 -85,175 20,205 145,-55 -20,-205" />
      <line x1="-20" y1="-205" x2="-15" y2="35" stroke-width="1.6" />
      <line x1="-150" y1="-30" x2="145" y2="-55" stroke-width="1.2" opacity="0.75" />
      <line x1="-15" y1="35" x2="20" y2="205" stroke-width="1.6" />
    </g>
  </g>
</svg>
