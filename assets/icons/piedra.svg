<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <!-- Luz de estudio cenital-izquierda -->
    <radialGradient id="studio-vignette" cx="30%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#283142" />
      <stop offset="55%" stop-color="#161B26" />
      <stop offset="100%" stop-color="#0B101B" />
    </radialGradient>

    <linearGradient id="gold-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFE0BB" />
      <stop offset="50%" stop-color="#C8A96A" />
      <stop offset="100%" stop-color="#7D622F" />
    </linearGradient>

    <!-- Facetas minerales de la piedra -->
    <linearGradient id="stone-lit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A5568" />
      <stop offset="100%" stop-color="#283142" />
    </linearGradient>
    <linearGradient id="stone-mid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#283142" />
      <stop offset="100%" stop-color="#161B26" />
    </linearGradient>
    <linearGradient id="stone-shadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B26" />
      <stop offset="100%" stop-color="#070A12" />
    </linearGradient>

    <filter id="monolith-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="12" dy="28" stdDeviation="20" flood-color="#04060B" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- SISTEMA UNIFICADO DE MARCO DE CARTA (Compartido por Piedra, Papel y Tijera) -->
  <rect x="12" y="12" width="576" height="776" rx="36" fill="url(#studio-vignette)" stroke="url(#gold-frame)" stroke-width="3" />
  <rect x="34" y="34" width="532" height="732" rx="22" fill="none" stroke="url(#gold-frame)" stroke-width="1.2" opacity="0.75" />
  <rect x="48" y="48" width="504" height="704" rx="14" fill="none" stroke="#7A8494" stroke-width="0.75" opacity="0.3" />

  <!-- Índices Geométricos de Esquina (Símbolo Mineral Hexagonal, Sin Texto) -->
  <g transform="translate(76, 80)" stroke="url(#gold-frame)" stroke-width="1.8" fill="#0B101B">
    <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11" />
    <polygon points="0,-10 9,-5 9,5 0,10 -9,5 -9,-5" fill="#C8A96A" stroke="none" />
  </g>
  <g transform="translate(524, 720) rotate(180)" stroke="url(#gold-frame)" stroke-width="1.8" fill="#0B101B">
    <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11" />
    <polygon points="0,-10 9,-5 9,5 0,10 -9,5 -9,-5" fill="#C8A96A" stroke="none" />
  </g>

  <!-- Halo de gravedad detrás de la escultura -->
  <circle cx="300" cy="390" r="185" fill="none" stroke="#C8A96A" stroke-width="0.75" opacity="0.3" />
  <circle cx="300" cy="390" r="145" fill="#0B101B" opacity="0.45" />

  <!-- ILUSTRACIÓN ESCULTÓRICA: MONOLITO DE BASALTO Y KINTSUGI DORADO -->
  <g filter="url(#monolith-shadow)" transform="translate(300, 395)">
    <!-- Faceta Superior Izquierda (Recibe la Key Light cálida) -->
    <polygon points="0,-195 -135,-75 -35,-25" fill="url(#stone-lit)" stroke="#949FB1" stroke-width="0.5" />
    
    <!-- Faceta Superior Derecha (Media luz) -->
    <polygon points="0,-195 140,-60 -35,-25" fill="url(#stone-mid)" />
    
    <!-- Faceta Central Izquierda (Volumen mineral) -->
    <polygon points="-135,-75 -155,75 -35,-25" fill="url(#stone-lit)" />
    <polygon points="-155,75 -35,110 -35,-25" fill="url(#stone-mid)" />
    
    <!-- Faceta Central Derecha (Sombra dramática) -->
    <polygon points="-35,-25 140,-60 150,85 -35,110" fill="url(#stone-shadow)" />
    
    <!-- Facetas Inferiores (Base Escultórica) -->
    <polygon points="-155,75 -35,110 -10,205" fill="url(#stone-mid)" />
    <polygon points="-35,110 150,85 -10,205" fill="#070A12" />

    <!-- Vetas de Oro Kintsugi (Filigrana mineral incrustada) -->
    <g fill="none" stroke="url(#gold-frame)" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="0,-195 -35,-25 -35,110 -10,205" stroke-width="3" />
      <polyline points="-135,-75 -35,-25 140,-60" stroke-width="2.2" />
      <polyline points="-82,-48 -58,28 -110,60" stroke-width="1.5" opacity="0.85" />
      <polyline points="-35,45 55,20 98,65" stroke-width="1.8" opacity="0.9" />
    </g>

    <!-- Destellos especulares de arista -->
    <circle cx="-35" cy="-25" r="4" fill="#F7F4ED" />
    <circle cx="-35" cy="110" r="3" fill="#EFE0BB" />
  </g>
</svg>
