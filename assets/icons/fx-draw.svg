<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="draw-steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F4ED" />
      <stop offset="50%" stop-color="#949FB1" />
      <stop offset="100%" stop-color="#566070" />
    </linearGradient>
    <linearGradient id="draw-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFE0BB" />
      <stop offset="100%" stop-color="#C8A96A" />
    </linearGradient>
  </defs>

  <!-- Equilibrio Simétrico Dual (Dos anillos en resonancia) -->
  <g transform="translate(400, 400)" fill="none">
    <!-- Eje de Horizonte Equilibrado -->
    <line x1="-340" y1="0" x2="340" y2="0" stroke="url(#draw-steel)" stroke-width="2" />
    
    <!-- Anillo Izquierdo (Jugador 1) -->
    <circle cx="-110" cy="0" r="140" stroke="url(#draw-steel)" stroke-width="3" />
    <circle cx="-110" cy="0" r="122" stroke="#7A8494" stroke-width="1" stroke-dasharray="6 8" />

    <!-- Anillo Derecho (Jugador 2) -->
    <circle cx="110" cy="0" r="140" stroke="url(#draw-gold)" stroke-width="3" />
    <circle cx="110" cy="0" r="122" stroke="#C8A96A" stroke-width="1" stroke-dasharray="6 8" />

    <!-- Vesica Piscis Central (Intersección de Empate) -->
    <polygon points="0,-88 46,0 0,88 -46,0" fill="#161B26" stroke="#F7F4ED" stroke-width="2.5" />
    <circle cx="0" cy="0" r="12" fill="#F7F4ED" />
    <circle cx="-250" cy="0" r="6" fill="#949FB1" />
    <circle cx="250" cy="0" r="6" fill="#C8A96A" />
  </g>
</svg>
