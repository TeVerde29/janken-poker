<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="back-surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2534" />
      <stop offset="50%" stop-color="#161B26" />
      <stop offset="100%" stop-color="#0B101B" />
    </linearGradient>

    <linearGradient id="gold-foil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFE0BB" />
      <stop offset="40%" stop-color="#C8A96A" />
      <stop offset="70%" stop-color="#9A7B3E" />
      <stop offset="100%" stop-color="#DFC286" />
    </linearGradient>

    <pattern id="micro-lattice" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 12 0 L 24 12 L 12 24 L 0 12 Z" fill="none" stroke="#7A8494" stroke-width="0.4" opacity="0.18" />
    </pattern>
  </defs>

  <!-- Cuerpo de la Carta (Proporción 3:4 = 600x800) -->
  <rect x="12" y="12" width="576" height="776" rx="36" fill="url(#back-surface)" stroke="url(#gold-foil)" stroke-width="3" />
  
  <!-- Textura Micro-Grabada -->
  <rect x="28" y="28" width="544" height="744" rx="24" fill="url(#micro-lattice)" />

  <!-- Sistema de Bordes Doble Bisel -->
  <rect x="34" y="34" width="532" height="732" rx="20" fill="none" stroke="url(#gold-foil)" stroke-width="1.5" opacity="0.85" />
  <rect x="46" y="46" width="508" height="708" rx="14" fill="none" stroke="#7A8494" stroke-width="0.75" opacity="0.4" />

  <!-- Esquinas Arquitectónicas Simétricas -->
  <g stroke="url(#gold-foil)" stroke-width="1.5" fill="none">
    <path d="M 34 90 L 90 34 M 34 110 L 110 34" opacity="0.6" />
    <path d="M 566 90 L 510 34 M 566 110 L 490 34" opacity="0.6" />
    <path d="M 34 710 L 90 766 M 34 690 L 110 766" opacity="0.6" />
    <path d="M 566 710 L 510 766 M 566 690 L 490 766" opacity="0.6" />
  </g>

  <!-- Geometría Sagrada Central (Tríada de Equilibrio) -->
  <g transform="translate(300, 400)">
    <!-- Arco solar exterior -->
    <circle r="190" fill="none" stroke="url(#gold-foil)" stroke-width="1.5" opacity="0.7" />
    <circle r="176" fill="none" stroke="url(#gold-foil)" stroke-width="0.75" stroke-dasharray="4 8" opacity="0.6" />
    
    <!-- Estrella Octogonal de Precisión -->
    <rect x="-125" y="-125" width="250" height="250" fill="none" stroke="url(#gold-foil)" stroke-width="1.5" opacity="0.65" />
    <rect x="-125" y="-125" width="250" height="250" fill="none" stroke="url(#gold-foil)" stroke-width="1.5" transform="rotate(45)" opacity="0.65" />

    <!-- Rombo Vertical Interior -->
    <polygon points="0,-240 150,0 0,240 -150,0" fill="#0B101B" fill-opacity="0.7" stroke="url(#gold-foil)" stroke-width="2" />
    
    <!-- Los Tres Anillos Entrelazados (Piedra, Papel, Tijera) -->
    <circle cx="0" cy="-52" r="56" fill="none" stroke="url(#gold-foil)" stroke-width="2" opacity="0.9" />
    <circle cx="-45" cy="28" r="56" fill="none" stroke="url(#gold-foil)" stroke-width="2" opacity="0.9" />
    <circle cx="45" cy="28" r="56" fill="none" stroke="url(#gold-foil)" stroke-width="2" opacity="0.9" />

    <!-- Núcleo de Marfil y Oro -->
    <polygon points="0,-32 28,0 0,32 -28,0" fill="url(#gold-foil)" />
    <circle r="6" fill="#0B101B" />

    <!-- Eje Vertical Editorial -->
    <line x1="0" y1="-320" x2="0" y2="-240" stroke="url(#gold-foil)" stroke-width="1.5" />
    <line x1="0" y1="240" x2="0" y2="320" stroke="url(#gold-foil)" stroke-width="1.5" />
    <circle cx="0" cy="-320" r="4" fill="#C8A96A" />
    <circle cx="0" cy="320" r="4" fill="#C8A96A" />
  </g>
</svg>
