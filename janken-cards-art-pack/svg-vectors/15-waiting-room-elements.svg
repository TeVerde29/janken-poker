<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="wait-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F4ED" />
      <stop offset="50%" stop-color="#C8A96A" />
      <stop offset="100%" stop-color="#7D622F" />
    </linearGradient>
    <linearGradient id="wait-steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#949FB1" />
      <stop offset="100%" stop-color="#283142" />
    </linearGradient>
  </defs>

  <!-- Astrolabio Cinético para Sala de Espera (Diseñado para rotar por capas en CSS) -->
  <g transform="translate(300, 300)" fill="none">
    <!-- Anillo Exterior (Gris Acero, Escala de Minutos) -->
    <g id="wait-ring-outer">
      <circle r="220" stroke="url(#wait-steel)" stroke-width="1.5" opacity="0.6" />
      <circle r="204" stroke="url(#wait-steel)" stroke-width="1" stroke-dasharray="2 14" opacity="0.7" />
      <circle cx="0" cy="-220" r="5" fill="#949FB1" />
      <circle cx="0" cy="220" r="5" fill="#949FB1" />
    </g>

    <!-- Anillo Medio (Oro Suave, Órbita de Sala) -->
    <g id="wait-ring-middle">
      <circle r="156" stroke="url(#wait-gold)" stroke-width="2" />
      <polygon points="0,-156 135,78 -135,78" stroke="url(#wait-gold)" stroke-width="1" opacity="0.45" />
      <polygon points="0,156 135,-78 -135,-78" stroke="url(#wait-gold)" stroke-width="1" opacity="0.45" />
      <circle cx="0" cy="-156" r="6" fill="#F7F4ED" />
    </g>

    <!-- Núcleo Pendular (Dos Cartas Buscando Sincronía) -->
    <g id="wait-core-cards">
      <!-- Carta Anfitrión (Activa en Oro) -->
      <rect x="-54" y="-68" width="76" height="104" rx="10" transform="rotate(-12)" fill="#161B26" stroke="url(#wait-gold)" stroke-width="2.5" />
      <!-- Carta Invitado (Esperando conexión en Acero Punteado) -->
      <rect x="-22" y="-36" width="76" height="104" rx="10" transform="rotate(12)" fill="#0B101B" fill-opacity="0.75" stroke="#949FB1" stroke-width="2" stroke-dasharray="6 5" />
      <!-- Punto de Sincronía -->
      <circle cx="0" cy="0" r="8" fill="url(#wait-gold)" />
    </g>
  </g>
</svg>
