<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <!-- Mismo sistema de iluminación cenital-izquierda -->
    <radialGradient id="studio-vignette" cx="30%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#283142" />
      <stop offset="55%" stop-color="#161B26" />
      <stop offset="100%" stop-color="#0B101B" />
    </radialGradient>

    <linearGradient id="gold-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFE0BB" />
      <stop offset="50%" stop-color="#C8A96A" />
      <stop offset="100%" stop-color="#7D622F" />
    </linearGradient>

    <!-- Acero de Damasco / Titanio Cepillado -->
    <linearGradient id="blade-steel-bright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F4ED" />
      <stop offset="35%" stop-color="#949FB1" />
      <stop offset="80%" stop-color="#566070" />
      <stop offset="100%" stop-color="#283142" />
    </linearGradient>
    <linearGradient id="blade-steel-dark" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7A8494" />
      <stop offset="50%" stop-color="#283142" />
      <stop offset="100%" stop-color="#0B101B" />
    </linearGradient>

    <filter id="blades-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="12" dy="28" stdDeviation="20" flood-color="#04060B" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- SISTEMA UNIFICADO DE MARCO DE CARTA -->
  <rect x="12" y="12" width="576" height="776" rx="36" fill="url(#studio-vignette)" stroke="url(#gold-frame)" stroke-width="3" />
  <rect x="34" y="34" width="532" height="732" rx="22" fill="none" stroke="url(#gold-frame)" stroke-width="1.2" opacity="0.75" />
  <rect x="48" y="48" width="504" height="704" rx="14" fill="none" stroke="#7A8494" stroke-width="0.75" opacity="0.3" />

  <!-- Índices Geométricos de Esquina (Símbolo Hojas Cruzadas, Sin Texto) -->
  <g transform="translate(76, 80)" stroke="url(#gold-frame)" stroke-width="2" fill="none">
    <line x1="-16" y1="-18" x2="16" y2="18" />
    <line x1="16" y1="-18" x2="-16" y2="18" />
    <circle cx="0" cy="0" r="6" fill="#0B101B" stroke="#C8A96A" stroke-width="2" />
  </g>
  <g transform="translate(524, 720) rotate(180)" stroke="url(#gold-frame)" stroke-width="2" fill="none">
    <line x1="-16" y1="-18" x2="16" y2="18" />
    <line x1="16" y1="-18" x2="-16" y2="18" />
    <circle cx="0" cy="0" r="6" fill="#0B101B" stroke="#C8A96A" stroke-width="2" />
  </g>

  <!-- Halo de gravedad detrás de la escultura -->
  <circle cx="300" cy="390" r="185" fill="none" stroke="#C8A96A" stroke-width="0.75" opacity="0.3" />
  <circle cx="300" cy="390" r="145" fill="#0B101B" opacity="0.45" />

  <!-- ILUSTRACIÓN ESCULTÓRICA: TIJERAS DE ACERO FORJADO Y PIVOTE DE ORO -->
  <g filter="url(#blades-shadow)" transform="translate(300, 395)">
    <!-- Hoja 1 (Inclinada de Superior-Derecha a Inferior-Izquierda) -->
    <g transform="rotate(28)">
      <!-- Filo biselado claro -->
      <polygon points="0,-225 34,-20 0,85" fill="url(#blade-steel-bright)" />
      <!-- Lomo de acero oscuro -->
      <polygon points="0,-225 -26,-20 0,85" fill="url(#blade-steel-dark)" />
      <!-- Anillo de agarre escultórico -->
      <circle cx="28" cy="145" r="46" fill="none" stroke="url(#gold-frame)" stroke-width="10" />
      <circle cx="28" cy="145" r="38" fill="none" stroke="#949FB1" stroke-width="1.5" />
    </g>

    <!-- Hoja 2 (Inclinada de Superior-Izquierda a Inferior-Derecha) -->
    <g transform="rotate(-28)">
      <!-- Filo biselado claro -->
      <polygon points="0,-225 -34,-20 0,85" fill="url(#blade-steel-bright)" />
      <!-- Lomo de acero oscuro -->
      <polygon points="0,-225 26,-20 0,85" fill="url(#blade-steel-dark)" />
      <!-- Anillo de agarre escultórico -->
      <circle cx="-28" cy="145" r="46" fill="none" stroke="url(#gold-frame)" stroke-width="10" />
      <circle cx="-28" cy="145" r="38" fill="none" stroke="#949FB1" stroke-width="1.5" />
      <!-- Arista especular de corte -->
      <line x1="0" y1="-225" x2="0" y2="85" stroke="#F7F4ED" stroke-width="1.2" opacity="0.8" />
    </g>

    <!-- Fulcro / Eje Mecánico de Relojería en Oro Suave -->
    <circle cx="0" cy="-12" r="24" fill="#0B101B" stroke="url(#gold-frame)" stroke-width="4" />
    <circle cx="0" cy="-12" r="14" fill="url(#gold-frame)" />
    <circle cx="0" cy="-12" r="5" fill="#0B101B" />
  </g>
</svg>
