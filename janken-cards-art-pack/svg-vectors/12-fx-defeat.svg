<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="defeat-vignette" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#070A12" stop-opacity="0.85" />
      <stop offset="65%" stop-color="#161B26" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#070A12" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="fracture-line" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#949FB1" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6E3B3B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#283142" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <g transform="translate(400, 400)">
    <circle r="340" fill="url(#defeat-vignette)" />

    <!-- Marco Roto / Eclipsado -->
    <circle r="210" fill="none" stroke="#283142" stroke-width="2" stroke-dasharray="45 18 90 24" />

    <!-- Líneas de Fractura Mineral (Sobrias, sin sangre ni clichés arcade) -->
    <g fill="none" stroke="url(#fracture-line)" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="-140,-230 -25,-65 35,15 -95,220" stroke-width="3.5" />
      <polyline points="-25,-65 135,-120 210,-155" stroke-width="2" />
      <polyline points="35,15 165,95 230,175" stroke-width="2.2" />
      <polyline points="-25,-65 -160,-10" stroke-width="1.5" />
    </g>

    <!-- Fragmentos Desprendidos -->
    <polygon points="-15,-25 18,-8 -4,22" fill="#1E2534" stroke="#6E3B3B" stroke-width="1.5" />
    <polygon points="48,-42 72,-28 54,-10" fill="#161B26" stroke="#566070" stroke-width="1" />
    <polygon points="-58,45 -32,62 -48,82" fill="#161B26" stroke="#566070" stroke-width="1" />
  </g>
</svg>
