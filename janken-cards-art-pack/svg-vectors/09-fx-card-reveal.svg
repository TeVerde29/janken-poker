<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="reveal-flare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F7F4ED" stop-opacity="0.95" />
      <stop offset="22%" stop-color="#DFC286" stop-opacity="0.55" />
      <stop offset="55%" stop-color="#C8A96A" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#C8A96A" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="reveal-ray" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#C8A96A" stop-opacity="0" />
      <stop offset="50%" stop-color="#F7F4ED" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#C8A96A" stop-opacity="0" />
    </linearGradient>
  </defs>

  <g transform="translate(400, 400)">
    <!-- Resplandor radial cálido -->
    <circle r="360" fill="url(#reveal-flare)" />
    
    <!-- Onda expansiva de precisión -->
    <circle r="240" fill="none" stroke="#EFE0BB" stroke-width="1.5" opacity="0.65" />
    <circle r="310" fill="none" stroke="#C8A96A" stroke-width="0.75" stroke-dasharray="8 12" opacity="0.45" />

    <!-- Destello Anamórfico Horizontal y Vertical -->
    <ellipse rx="380" ry="6" fill="url(#reveal-ray)" />
    <ellipse rx="6" ry="380" fill="url(#reveal-ray)" />
    <polygon points="0,-160 12,0 0,160 -12,0" fill="#F7F4ED" opacity="0.85" />
    <polygon points="-160,0 0,12 160,0 0,-12" fill="#F7F4ED" opacity="0.85" />
  </g>
</svg>
