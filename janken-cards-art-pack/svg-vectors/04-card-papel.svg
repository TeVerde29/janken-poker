<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <!-- Iluminación de estudio cenital-izquierda unificada -->
    <radialGradient id="studio-vignette" cx="30%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#283142" />
      <stop offset="55%" stop-color="#161B26" />
      <stop offset="100%" stop-color="#0B101B" />
    </radialGradient>

    <linearGradient id="gold-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFE0BB" />
      <stop offset="50%" stop-color="#C8A96A" />
      <stop offset="100%" stop-color="#7D622F" />
    </linearGradient>

    <!-- Gradiente de hoja de papel marfil con curvatura orgánica -->
    <linearGradient id="paper-sheet-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="38%" stop-color="#F7F4ED" />
      <stop offset="72%" stop-color="#E5DEC9" />
      <stop offset="100%" stop-color="#C9BFA6" />
    </linearGradient>

    <!-- Hoja secundaria trasera -->
    <linearGradient id="paper-sheet-back" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFD7C4" />
      <stop offset="100%" stop-color="#9E947C" />
    </linearGradient>

    <!-- Solapa doblada (Dog-ear corner fold) -->
    <linearGradient id="paper-corner-flap" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B5AA90" />
      <stop offset="45%" stop-color="#EFECE4" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Sombra suave de la esquina doblada sobre la hoja -->
    <linearGradient id="flap-cast-shadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B101B" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#0B101B" stop-opacity="0" />
    </linearGradient>

    <filter id="sheet-elevation" x="-25%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="14" dy="28" stdDeviation="18" flood-color="#04060B" flood-opacity="0.82" />
    </filter>
  </defs>

  <!-- SISTEMA UNIFICADO DE MARCO DE CARTA -->
  <rect x="12" y="12" width="576" height="776" rx="36" fill="url(#studio-vignette)" stroke="url(#gold-frame)" stroke-width="3" />
  <rect x="34" y="34" width="532" height="732" rx="22" fill="none" stroke="url(#gold-frame)" stroke-width="1.2" opacity="0.75" />
  <rect x="48" y="48" width="504" height="704" rx="14" fill="none" stroke="#7A8494" stroke-width="0.75" opacity="0.3" />

  <!-- Índices Geométricos de Esquina (Símbolo de Hoja con Esquina Doblada, Sin Texto) -->
  <g transform="translate(76, 80)" stroke="url(#gold-frame)" stroke-width="1.8" fill="#0B101B">
    <path d="M -14,-20 L 6,-20 L 14,-12 L 14,20 L -14,20 Z" fill="#F7F4ED" />
    <path d="M 6,-20 L 6,-12 L 14,-12 Z" fill="#C8A96A" />
  </g>
  <g transform="translate(524, 720) rotate(180)" stroke="url(#gold-frame)" stroke-width="1.8" fill="#0B101B">
    <path d="M -14,-20 L 6,-20 L 14,-12 L 14,20 L -14,20 Z" fill="#F7F4ED" />
    <path d="M 6,-20 L 6,-12 L 14,-12 Z" fill="#C8A96A" />
  </g>

  <!-- Halo de gravedad detrás de la hoja -->
  <circle cx="300" cy="395" r="185" fill="none" stroke="#C8A96A" stroke-width="0.75" opacity="0.3" />
  <circle cx="300" cy="395" r="145" fill="#0B101B" opacity="0.45" />

  <!-- ILUSTRACIÓN ESCULTÓRICA: HOJA DE PAPEL PERGAMINO MARFIL CON ONDA Y PLIEGUE -->
  <g filter="url(#sheet-elevation)" transform="translate(300, 395)">
    
    <!-- Segunda hoja en segundo plano (desplazada en rotación suave) -->
    <path d="M -115,-175
             C -40,-190 55,-175 120,-155
             C 130,-50 110,75 95,180
             C 20,165 -65,180 -130,160
             C -115,50 -105,-65 -115,-175 Z"
          transform="rotate(-8) translate(-12, 10)"
          fill="url(#paper-sheet-back)"
          stroke="url(#gold-frame)"
          stroke-width="1.5"
          opacity="0.88" />

    <!-- Hoja Principal de Papel Algodón Marfil con curvatura en S y esquina superior derecha doblada -->
    <path d="M -118,-185
             C -45,-200 10,-192 52,-185
             L 128,-105
             C 138,10 112,105 122,188
             C 35,202 -45,172 -124,182
             C -136,80 -102,-55 -118,-185 Z"
          fill="url(#paper-sheet-main)"
          stroke="url(#gold-frame)"
          stroke-width="2.5"
          stroke-linejoin="round" />

    <!-- Marco interior gofrado (Debossed Editorial Border dentro de la hoja de papel) -->
    <path d="M -96,-160
             C -38,-172 6,-166 42,-160
             L 104,-95
             C 112,5 90,90 98,162
             C 28,174 -38,150 -102,158
             C -112,68 -84,-45 -96,-160 Z"
          fill="none"
          stroke="#C8A96A"
          stroke-width="1"
          opacity="0.55" />

    <!-- Líneas de caligrafía / pauta editorial sutilmente grabadas en el papel -->
    <g fill="none" stroke="#9E947C" stroke-width="1.3" stroke-linecap="round" opacity="0.45">
      <path d="M -68,-75 C -15,-84 25,-78 62,-72" />
      <path d="M -66,-35 C -10,-44 35,-36 74,-30" />
      <path d="M -64,5 C -8,-4 38,4 72,10" />
      <path d="M -68,45 C -12,36 32,44 68,50" />
      <path d="M -72,85 C -20,76 18,82 42,86" />
    </g>

    <!-- Sello geométrico dorado estampado en el centro del papel -->
    <g transform="translate(2, 6)" stroke="url(#gold-frame)" fill="none" opacity="0.85">
      <circle r="28" stroke-width="1.4" />
      <polygon points="0,-18 18,0 0,18 -18,0" stroke-width="1.4" fill="#C8A96A" fill-opacity="0.18" />
    </g>

    <!-- Sombra arrojada por el pliegue de la esquina superior derecha -->
    <polygon points="52,-185 34,-92 128,-105" fill="url(#flap-cast-shadow)" />

    <!-- Pliegue físico de la esquina (Dog-ear fold) mostrando el reverso sedoso del papel -->
    <path d="M 52,-185
             C 48,-145 44,-120 42,-98
             C 72,-102 98,-104 128,-105 Z"
          fill="url(#paper-corner-flap)"
          stroke="url(#gold-frame)"
          stroke-width="2.2"
          stroke-linejoin="round" />
  </g>
</svg>
